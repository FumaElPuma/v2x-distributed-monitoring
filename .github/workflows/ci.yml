name: V2X CI/CD

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Build V2X-SERVICE Docker image
        run: |
          docker build \
            -f services/v2x-service/Dockerfile \
            -t v2x-service:ci \
            .