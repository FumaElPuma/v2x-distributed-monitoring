name: V2X CI/CD

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Build V2X-SERVICE Docker image
        run: |
          docker build \
            -f services/v2x-service/Dockerfile \
            -t v2x-service:ci \
            .
      
      # From here on, only main or Git tags publish to AWS

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS credentials
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image with Git SHA
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag v2x-service:ci \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Tag release image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker tag v2x-service:ci \
            $ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_TAG