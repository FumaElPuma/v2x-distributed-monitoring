<!doctype html>
<html><head><meta charset="utf-8"><title>V2X-SERVICE</title>
<style>body{font-family:sans-serif;margin:24px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px 8px}</style>
</head><body>
<h1>V2X-SERVICE</h1>
<p id="stats"></p>
<h2>Alerts</h2>
<table><thead><tr><th>Time</th><th>Type</th><th>Segment</th><th>Severity</th><th>Message</th></tr></thead>
<tbody id="alerts"></tbody></table>
<script>
async function refresh() {
  const r = await (await fetch('/report')).json();
  document.getElementById('stats').textContent =
    Object.entries(r).map(([k, v]) => k + ': ' + v).join(' | ');
  const a = await (await fetch('/alerts')).json();
  document.getElementById('alerts').innerHTML = a.map(x =>
    `<tr><td>${x.created_time}</td><td>${x.alert_type}</td><td>${x.location.segment_id}</td>` +
    `<td>${x.severity}</td><td>${x.message}</td></tr>`).join('');
}
refresh(); setInterval(refresh, 2000);
</script>
</body></html>
